<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Retrieve Aadhaar — Realistic Mock</title>
    <style>
      body { font-family: Roboto, Arial, sans-serif; padding: 16px; }
      mat-form-field, .mat-mdc-form-field {
        display: block; margin: 12px 0; border: 1px solid #ddd; padding: 12px; border-radius: 4px;
      }
      mat-label, label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; }
      input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
      .uidai-or-link { color: #0052a5; text-decoration: underline; cursor: pointer; margin-left: 8px; font-size: 13px; }
      .hidden-field { display: none !important; }
      mat-datepicker-toggle { display: inline-block; margin-left: 8px; color: #666; }
    </style>
  </head>
  <body>
    <h2>Retrieve Aadhaar Number</h2>
    <form id="retrieve-form">
      <mat-form-field class="mat-mdc-form-field" id="name-field">
        <mat-label>Enter Name as per Aadhaar</mat-label>
        <input matInput type="text" placeholder="Enter Name as per Aadhaar" />
      </mat-form-field>

      <mat-form-field class="mat-mdc-form-field" id="dob-field">
        <mat-label>Enter Date of Birth</mat-label>
        <input matInput matDatepicker readonly placeholder="DD/MM/YYYY" id="dob-input" />
        <mat-datepicker-toggle>📅</mat-datepicker-toggle>
      </mat-form-field>

      <mat-form-field class="mat-mdc-form-field" id="mobile-field">
        <mat-label>Enter Mobile Number</mat-label>
        <input matInput type="tel" placeholder="Enter Mobile Number" maxlength="10" />
        <span class="uidai-or-link" id="or-email-link">OR Enter Email Address</span>
      </mat-form-field>

      <mat-form-field class="mat-mdc-form-field hidden-field" id="email-field">
        <mat-label>Enter Email Address</mat-label>
        <input matInput type="email" placeholder="Enter Email Address" />
        <span class="uidai-or-link" id="or-mobile-link">OR Enter Mobile Number</span>
      </mat-form-field>

      <mat-form-field class="mat-mdc-form-field" id="captcha-field">
        <mat-label>Enter Captcha</mat-label>
        <input matInput type="text" placeholder="Enter Captcha" />
      </mat-form-field>

      <button type="button" id="send-otp">Send OTP</button>
    </form>

    <script>
      let useEmail = false;
      const dobField = document.getElementById('dob-field');
      const emailField = document.getElementById('email-field');
      const mobileField = document.getElementById('mobile-field');

      // Real UIDAI: OR Enter Email hides DOB, toggles mobile/email contact field
      document.getElementById('or-email-link').addEventListener('click', function () {
        useEmail = true;
        dobField.classList.add('hidden-field');
        mobileField.classList.add('hidden-field');
        emailField.classList.remove('hidden-field');
      });

      document.getElementById('or-mobile-link').addEventListener('click', function () {
        useEmail = false;
        dobField.classList.add('hidden-field');
        emailField.classList.add('hidden-field');
        mobileField.classList.remove('hidden-field');
      });

      document.getElementById('send-otp').addEventListener('click', function () {
        const name = document.querySelector('#name-field input').value.trim();
        const mobile = document.querySelector('#mobile-field input')?.value?.trim() || '';
        const email = document.querySelector('#email-field input')?.value?.trim() || '';
        const captcha = document.querySelector('#captcha-field input').value.trim();
        const dob = document.getElementById('dob-input').value.trim();
        const dobHidden = dobField.classList.contains('hidden-field');

        if (!name || !captcha) {
          window.__otpBlocked = 'missing fields';
          window.__otpSent = false;
          return;
        }
        if (!dobHidden && !dob) {
          window.__otpBlocked = 'dob required';
          window.__otpSent = false;
          return;
        }
        if (useEmail && !email) {
          window.__otpBlocked = 'email required';
          window.__otpSent = false;
          return;
        }
        if (!useEmail && dobHidden && !mobile) {
          window.__otpBlocked = 'mobile required';
          window.__otpSent = false;
          return;
        }

        window.__otpBlocked = null;
        window.__otpSent = true;
        fetch('/api/retrieve-otp', { method: 'POST', body: JSON.stringify({ name, mobile, email, captcha }) }).catch(() => {});
      });
    </script>
  </body>
</html>
