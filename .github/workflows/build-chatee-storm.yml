name: Build Chatee Storm APK
on:
  workflow_dispatch:
  push:
    branches:
      - 'cursor/chatee-storm-apk-*'
    paths:
      - 'app/**'
      - '.github/workflows/build-chatee-storm.yml'
      - 'scripts/encrypt_storm_vault.py'
      - 'scripts/verify_chatee_apk.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Generate native vault
        run: python3 scripts/encrypt_storm_vault.py
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Copy to rebel-panel
        run: |
          cp app/build/outputs/apk/release/app-release.apk rebel-panel/Chatee-Video-Call-Fun-Storm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Chatee-Storm-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            rebel-panel/Chatee-Video-Call-Fun-Storm.apk
      - name: Verify no plaintext Firebase leaks
        run: python3 scripts/verify_chatee_apk.py app/build/outputs/apk/release/app-release.apk
