name: Build Rebel Panel APK
on:
  push:
    branches: [cursor/rebel-panel-apk-1641, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v3

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk RebelPanel.apk
        ls -lh RebelPanel.apk

    - uses: actions/upload-artifact@v4
      with:
        name: RebelPanel-INSTALL
        path: RebelPanel.apk
        retention-days: 90

    - name: GitHub Release
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      with:
        tag_name: rebel-panel-${{ github.run_number }}
        name: Rebel Panel APK
        body: |
          **RebelPanel.apk** — Android install karo.
          Panel: https://rebelbhaiya.alwaysdata.net/phone.php
        files: RebelPanel.apk
