name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v3
    - name: Create Icons
      run: |
        mkdir -p app/src/main/res/mipmap-hdpi
        echo '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#FFD700"/><corners android:radius="5dp"/><size android:width="48dp" android:height="48dp"/></shape>' > app/src/main/res/mipmap-hdpi/ic_launcher.xml
        echo '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#FFD700"/><size android:width="48dp" android:height="48dp"/></shape>' > app/src/main/res/mipmap-hdpi/ic_launcher_round.xml
    - name: Build
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew clean assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: SpinPlay99
        path: app/build/outputs/apk/debug/app-debug.apk
