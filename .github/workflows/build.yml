name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Delete All Obfuscation Files
      run: |
        rm -f app/proguard-rules.pro
        rm -f proguard-project.txt
        rm -rf app/src/main/res/raw
        rm -rf app/src/main/assets
        rm -rf app/src/main/jniLibs
        find . -name "*.pro" -delete
        find . -name "proguard*" -delete
        find . -name "*.rules" -delete
    
    - name: Setup gradle.properties
      run: |
        cat > gradle.properties << 'ENDPROP'
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        org.gradle.jvmargs=-Xmx2048m
        android.enableJetifier=false
        android.enableR8.fullMode=false
        android.enableResourceOptimizations=false
        android.experimental.enableNewResourceShrinker=false
        ENDPROP
    
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-build-cache --rerun-tasks
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SpinPlay99-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
