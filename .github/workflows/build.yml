name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle permission
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Create app icons
        run: |
          sudo apt-get install -y imagemagick
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-${dpi}
            case $dpi in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            convert -size ${size}x${size} xc:#FF6B1A \
              app/src/main/res/mipmap-${dpi}/ic_launcher.png
            convert -size ${size}x${size} xc:#FF6B1A \
              app/src/main/res/mipmap-${dpi}/ic_launcher_round.png
          done

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpinPlay99-debug
          path: app/build/outputs/apk/debug/app-debug.apk
