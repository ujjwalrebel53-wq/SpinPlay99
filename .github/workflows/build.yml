name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v3
    - name: Build
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew clean assembleRelease
    - name: Strip all binary and Kotlin metadata files
      run: |
        APK=$(find app/build/outputs/apk/release -name "app-release.apk" | head -1)
        echo "APK: $APK"
        # Remove ALL known binary/metadata files that trigger obfuscation scanners
        zip -d "$APK" \
          'assets/dexopt/baseline.prof' \
          'assets/dexopt/baseline.profm' \
          'kotlin/**' \
          'DebugProbesKt.bin' \
          'META-INF/services/kotlinx.coroutines.CoroutineExceptionHandler' \
          'META-INF/services/kotlinx.coroutines.internal.MainDispatcherFactory' \
          'META-INF/*.version' \
          'META-INF/*.kotlin_module' || true
        # Re-sign with release keystore
        BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
        $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
          --ks app/spinplay99.keystore \
          --ks-pass pass:spinplay99store \
          --key-pass pass:spinplay99store \
          --ks-key-alias spinplay99 \
          --out app/build/outputs/apk/release/app-release-final.apk \
          "$APK"
        echo "=== Verifying clean APK ==="
        unzip -l app/build/outputs/apk/release/app-release-final.apk | \
          grep -E "\.bin$|kotlin/|\.prof|\.kotlin|coroutines" \
          && echo "WARNING: suspicious files still present" \
          || echo "CLEAN APK confirmed"
    - uses: actions/upload-artifact@v4
      with:
        name: SpinPlay99
        path: app/build/outputs/apk/release/app-release-final.apk
