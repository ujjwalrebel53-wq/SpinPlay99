plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.nya.panel'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.nya.panel"
        minSdk 23
        targetSdk 34
        versionCode 14
        versionName "1.0.13"
        buildConfigField "String", "DEFAULT_PANEL_SERVER", "\"\""
        externalNativeBuild {
            cmake {
                cppFlags "-O2 -fvisibility=hidden -ffunction-sections -fdata-sections"
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

def panelPlainDir = file("src/main/assets/panel")
def genEncAssetsDir = file("$buildDir/generated/encrypted_assets")

tasks.register("packPanelAssets") {
    inputs.dir(panelPlainDir)
    outputs.dir(genEncAssetsDir)
    doLast {
        genEncAssetsDir.mkdirs()
        exec {
            commandLine "python3", "-m", "pip", "install", "cryptography", "--quiet", "--user"
            ignoreExitValue true
        }
        exec {
            commandLine "python3", rootProject.file("tools/pack_encrypted_assets.py"),
                    panelPlainDir.absolutePath, genEncAssetsDir.absolutePath,
                    String.valueOf(android.defaultConfig.versionCode)
        }
    }
}

android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name == "release") {
        variant.preBuildProvider.get().dependsOn("packPanelAssets")
        def mergeTask = variant.mergeAssetsProvider.get()
        mergeTask.dependsOn("packPanelAssets")
        mergeTask.doLast {
            def outDir = mergeTask.outputDir.get().asFile
            def panelDir = new File(outDir, "panel")
            if (panelDir.exists()) {
                panelDir.deleteDir()
            }
        }
    }
}

android.sourceSets.release.assets.srcDirs += genEncAssetsDir

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-installations'
}
