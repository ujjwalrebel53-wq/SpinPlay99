plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rebel.panel'
    compileSdk 34

    defaultConfig {
        applicationId "com.rebel.panel"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.1.0"
        buildConfigField "String", "REBEL_APP_SECRET", "\"rbl_app_xK9m2pQ7nL4wR8vT3hJ6fY1bN5cD0eA\""
        buildConfigField "String", "REBEL_APK_SHA256", "\"CHANGE_ME\""
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
