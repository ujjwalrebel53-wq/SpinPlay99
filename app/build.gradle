plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rebel.panel'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.rebel.panel"
        minSdk 24
        targetSdk 34
        versionCode 30
        versionName "5.2.0"
        buildConfigField "String", "REBEL_APP_SECRET", "\"rbl_app_xK9m2pQ7nL4wR8vT3hJ6fY1bN5cD0eA\""
        buildConfigField "String", "REBEL_APK_SHA256", "\"570290715E067531A5DF06DD139604192A70993C863E97F51A09609F8A702CECA\""
        buildConfigField "String", "SSL_PIN_PRIMARY", "\"sha256/SM2goQ/B0xk7U8iezGH0VeeoZwZWiEC9obc8uSCte8=\""
        buildConfigField "String", "SSL_PIN_BACKUP", "\"sha256/C5+lp5BmfbMGadTPwzoIB6l9a6Fi4EioGsliyc1tirc=\""
        buildConfigField "boolean", "SSL_PIN_ENFORCE", "true"
        buildConfigField "int", "MIN_SERVER_APK", "19"
        externalNativeBuild {
            cmake {
                cppFlags "-O2 -fvisibility=hidden -ffunction-sections -fdata-sections"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    flavorDimensions "tier"
    productFlavors {
        parent {
            dimension "tier"
            applicationIdSuffix ".parent"
            versionNameSuffix "-parent"
            resValue "string", "app_name", "Rebel Panel Pro"
            buildConfigField "boolean", "IS_PARENT_APK", "true"
            buildConfigField "String", "REBEL_VARIANT", "\"parent\""
        }
        user {
            dimension "tier"
            resValue "string", "app_name", "Rebel Panel"
            buildConfigField "boolean", "IS_PARENT_APK", "false"
            buildConfigField "String", "REBEL_VARIANT", "\"user\""
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            buildConfigField "boolean", "SSL_PIN_ENFORCE", "false"
            buildConfigField "boolean", "RASP_KILL", "false"
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "RASP_KILL", "true"
            buildConfigField "boolean", "SSL_PIN_ENFORCE", "true"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

def panelPlainDir = file("src/main/assets/panel")
def genEncAssetsDir = file("$buildDir/generated/encrypted_assets")

tasks.register("packPanelAssets") {
    inputs.dir(panelPlainDir)
    outputs.dir(genEncAssetsDir)
    doLast {
        genEncAssetsDir.mkdirs()
        exec {
            commandLine "python3", "-m", "pip", "install", "cryptography", "--quiet", "--user"
            ignoreExitValue true
        }
        exec {
            commandLine "python3", rootProject.file("tools/pack_encrypted_assets.py"),
                    panelPlainDir.absolutePath, genEncAssetsDir.absolutePath,
                    String.valueOf(android.defaultConfig.versionCode)
        }
    }
}

android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name == "release") {
        variant.preBuildProvider.get().dependsOn("packPanelAssets")
        def mergeTask = variant.mergeAssetsProvider.get()
        mergeTask.dependsOn("packPanelAssets")
        mergeTask.doLast {
            def outDir = mergeTask.outputDir.get().asFile
            def panelDir = new File(outDir, "panel")
            if (panelDir.exists()) {
                panelDir.deleteDir()
            }
        }
    }
}

android.sourceSets.release.assets.srcDirs += genEncAssetsDir

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.scottyab:rootbeer-lib:0.1.0'
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.4.0'
}
